<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pose</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#e5e5e5; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#333; --accent:#60a5fa; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:16px; padding:24px 16px; }
  button { font:inherit; font-size:1.2rem; padding:12px 32px; border:0; border-radius:8px;
           background:var(--accent); color:#fff; cursor:pointer; }
  canvas { width:100%; max-width:400px; border-radius:12px; display:none; }
  #pose { font-size:2rem; font-weight:700; min-height:2.5rem; }
  #bars { width:100%; max-width:400px; display:flex; flex-direction:column; gap:6px; }
  .row { display:grid; grid-template-columns:8rem 1fr 3rem; align-items:center; gap:8px; font-size:.9rem; }
  .track { background:var(--muted); height:12px; border-radius:6px; overflow:hidden; }
  .fill { background:var(--accent); height:100%; width:0; }
  .pct { text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <button id="start">Start</button>
  <canvas id="canvas"></canvas>
  <div id="pose"></div>
  <div id="bars"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.6/dist/teachablemachine-pose.min.js"></script>
<script>
const URL = "https://teachablemachine.withgoogle.com/models/4vz6kuDjH/";
const SIZE = 400;
let model, webcam, ctx, rows = [];

document.getElementById("start").onclick = async (e) => {
  const btn = e.target;
  btn.disabled = true;
  btn.textContent = "Loading…";
  try {
    model = await tmPose.load(URL + "model.json", URL + "metadata.json");
    webcam = new tmPose.Webcam(SIZE, SIZE, true);
    await webcam.setup();
    await webcam.play();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Retry";
    document.getElementById("pose").textContent = "Camera error";
    return;
  }
  btn.remove();

  const canvas = document.getElementById("canvas");
  canvas.width = canvas.height = SIZE;
  canvas.style.display = "block";
  ctx = canvas.getContext("2d");

  const bars = document.getElementById("bars");
  rows = model.getClassLabels().map((label) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span>${label}</span><div class="track"><div class="fill"></div></div><span class="pct">0%</span>`;
    bars.appendChild(row);
    return { fill: row.querySelector(".fill"), pct: row.querySelector(".pct") };
  });

  requestAnimationFrame(loop);
};

async function loop() {
  webcam.update();
  const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
  const preds = await model.predict(posenetOutput);

  let best = preds[0];
  preds.forEach((p, i) => {
    const v = Math.round(p.probability * 100);
    rows[i].fill.style.width = v + "%";
    rows[i].pct.textContent = v + "%";
    if (p.probability > best.probability) best = p;
  });
  document.getElementById("pose").textContent = best.className;

  ctx.drawImage(webcam.canvas, 0, 0);
  if (pose) {
    tmPose.drawKeypoints(pose.keypoints, 0.5, ctx);
    tmPose.drawSkeleton(pose.keypoints, 0.5, ctx);
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
